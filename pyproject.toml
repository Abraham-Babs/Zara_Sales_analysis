[project]
name = "zara-sales-analysis"
version = "0.1.0"
description = "Commercial data audit and econometric modeling of the Kaggle Zara sales dataset."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.5.0",
]
